name: test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/claude-code
      - run: claude plugin validate . --strict
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm test
      - name: Check bench task manifest
        run: node bench/manifest.mjs --check
      - name: Validate JSON manifests parse
        run: |
          set -euo pipefail
          shopt -s nullglob
          marketplace=(.claude-plugin/marketplace.json)
          plugin_manifests=(plugins/*/.claude-plugin/plugin.json)
          hooks_files=(plugins/*/hooks/hooks.json)
          rules_files=(plugins/*/rules-manifest.json)
          if [ ${#marketplace[@]} -eq 0 ]; then
            echo 'ERROR: marketplace glob matched no files: .claude-plugin/marketplace.json' >&2
            exit 1
          fi
          if [ ${#plugin_manifests[@]} -eq 0 ]; then
            echo 'ERROR: plugin manifest glob matched no files: plugins/*/.claude-plugin/plugin.json' >&2
            exit 1
          fi
          if [ ${#hooks_files[@]} -eq 0 ]; then
            echo 'ERROR: hooks glob matched no files: plugins/*/hooks/hooks.json' >&2
            exit 1
          fi
          if [ ${#rules_files[@]} -eq 0 ]; then
            echo 'ERROR: rules manifest glob matched no files: plugins/*/rules-manifest.json' >&2
            exit 1
          fi
          paths=("${marketplace[@]}" "${plugin_manifests[@]}" "${hooks_files[@]}" "${rules_files[@]}" bench/tasks/manifest.json)
          printf 'Validating JSON manifests:\n'
          printf '  %s\n' "${paths[@]}"
          node -e "
          const fs = require('fs');
          const paths = process.argv.slice(1);
          for (const p of paths) {
            JSON.parse(fs.readFileSync(p, 'utf8'));
            console.log('ok', p);
          }
          " "${paths[@]}"
